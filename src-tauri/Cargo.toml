[package]
name = "wrusp"
version = "0.4.9"
description = "Cliente de escritorio no oficial de WhatsApp para Linux"
authors = ["aleixenandros"]
license = "Apache-2.0"
repository = "https://github.com/Aleixenandros/Wrusp"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
png = "0.18.1"

# WebKitGTK viene con la captura de medios desactivada y sus permisos hay que
# concederlos por la API nativa (ver `permissions`). GTK ya viene en el árbol
# de Tauri con esta misma versión: se declara para el diálogo de «guardar
# como» de las descargas (ver `shell`).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
# Los valores que devuelve `evaluate_javascript`/`call_async_javascript_function`
# son de JavaScriptCore y webkit2gtk no reexporta el crate. Versión clavada a la
# que usa webkit2gtk: si no coincide, los tipos no son los mismos.
javascriptcore = { version = "=1.1", package = "javascriptcore-rs" }
gtk = "0.18"
# Se usa una única conexión durante toda la ejecución. GNOME liga los avisos al
# emisor D-Bus y los retira si este desaparece; abrir y cerrar una conexión para
# cada mensaje hacía que los descartase antes de llegar a mostrarlos.
zbus = "5.19.0"

# Redirección de stdout/stderr al fichero de registro (ver `logs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
