[package]
name = "wrusp"
version = "0.3.9"
description = "Cliente de escritorio no oficial de WhatsApp para Linux"
authors = ["aleixenandros"]
license = "Apache-2.0"
repository = "https://github.com/Aleixenandros/Wrusp"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
# Las notificaciones no salen del plugin de Tauri: ese inyecta su propio
# `window.Notification` en todas las vistas, y las de WhatsApp no tienen IPC
# —ni deben tenerlo—, así que la página se quedaba sin permiso y no avisaba de
# nada. Se emiten desde Rust al recibir la señal nativa de WebKit.
notify-rust = "4.18.0"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
png = "0.18.1"

# WebKitGTK viene con la captura de medios desactivada y sus permisos hay que
# concederlos por la API nativa (ver `permissions`). GTK ya viene en el árbol
# de Tauri con esta misma versión: se declara para el diálogo de «guardar
# como» de las descargas (ver `shell`).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
# Los valores que devuelve `evaluate_javascript`/`call_async_javascript_function`
# son de JavaScriptCore y webkit2gtk no reexporta el crate. Versión clavada a la
# que usa webkit2gtk: si no coincide, los tipos no son los mismos.
javascriptcore = { version = "=1.1", package = "javascriptcore-rs" }
gtk = "0.18"

# Redirección de stdout/stderr al fichero de registro (ver `logs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
